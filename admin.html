<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RohtasTimes Admin</title>
<style>
body{margin:0;background:#f4f6f8;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#172033}
.wrap{max-width:900px;margin:auto;padding:18px}
.head{background:#d71920;color:#fff;padding:18px;border-radius:12px;margin-bottom:15px}.head h1{margin:0}
.box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:15px}
input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8dee6;border-radius:8px;margin:6px 0 12px;font-size:14px}
textarea{min-height:120px}.btn{border:0;border-radius:8px;padding:11px 16px;background:#d71920;color:#fff;font-weight:800;cursor:pointer}
.gray{background:#475569}.danger{background:#b91c1c}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border:1px solid #ddd;border-radius:10px;padding:13px;margin-top:10px}.item h3{margin:0 0 5px}
.meta{font-size:11px;color:#777}.hidden{display:none}.status{margin:8px 0;font-size:13px}
.upload{border:2px dashed #cbd5e1;border-radius:10px;padding:15px;background:#f8fafc}
.preview{max-width:100%;max-height:280px;border-radius:10px;margin-top:8px;display:none}
.small{font-size:12px;color:#64748b}
@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<main class="wrap">
<div class="head"><h1>RohtasTimes Admin</h1><div>News Publisher</div></div>

<section id="loginBox" class="box">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
<div id="loginStatus" class="status"></div>
</section>

<section id="adminBox" class="hidden">
<div class="box">
<h2>📰 नई खबर प्रकाशित करें</h2>

<div class="row">
<div>
<label>Category</label>
<select id="category">
<option>Rohtas</option><option>Bihar</option><option>India</option><option>World</option>
<option>Technology</option><option>Jobs</option><option>Admit Card</option>
<option>Result</option><option>Education</option><option>Business</option><option>Video</option>
</select>
</div>
<div>
<label>Job Category (सिर्फ Jobs के लिए)</label>
<select id="jobType">
<option value="">Not a Job</option><option>Government</option><option>Private</option>
<option>Railway</option><option>Police</option><option>Teaching</option><option>Banking</option>
</select>
</div>
</div>

<label>Headline</label>
<input id="title" placeholder="खबर का headline" oninput="autoSEO()">

<div class="row">
<div>
<label>Slug / URL</label>
<input id="slug" placeholder="jamui-molestation-case-nandan-yadav">
<div class="small">English में छोटा URL; खाली छोड़ने पर headline से अपने-आप बनेगा।</div>
</div>
<div>
<label>Focus Keyword</label>
<input id="focusKeyword" placeholder="जमुई छेड़खानी मामला">
</div>
</div>

<label>SEO Title</label>
<input id="seoTitle" placeholder="Google में दिखने वाला SEO title">

<label>Meta Description</label>
<textarea id="metaDescription" style="min-height:90px" maxlength="160" placeholder="Google search में दिखने वाला छोटा विवरण (लगभग 150-160 अक्षर)"></textarea>

<label>Short Description</label>
<textarea id="summary" placeholder="खबर का छोटा विवरण"></textarea>

<label>पूरी खबर</label>
<textarea id="content" placeholder="पूरी खबर यहां लिखें"></textarea>

<label>📷 फोटो / 🎥 वीडियो</label>
<div class="upload">
<input id="mediaFile" type="file" accept="image/*,video/*" onchange="previewMedia()">
<div class="small">फोटो: JPG, PNG, WEBP | वीडियो: MP4, WEBM, MOV</div>
<img id="imagePreview" class="preview">
<video id="videoPreview" class="preview" controls></video>
<div id="uploadStatus" class="status"></div>
</div>

<label>या Media URL डालें (वैकल्पिक)</label>
<input id="image" placeholder="https://...jpg या https://...mp4">

<label>Source</label>
<input id="source" placeholder="Source / Reporter">

<label>Canonical URL (वैकल्पिक)</label>
<input id="canonicalUrl" placeholder="https://rohtastimes.in/news/slug">

<label><input id="published" type="checkbox" checked style="width:auto"> Publish करें</label>
<br><br>

<button class="btn" onclick="publish()">🚀 Publish News</button>
<button class="btn gray" onclick="logout()">Logout</button>
<div id="status" class="status"></div>
</div>

<div class="box">
<h2>📋 Published News</h2>
<div id="list">Loading...</div>
</div>
</section>
</main>

<script>
const clientReady=SUPABASE_URL&&!SUPABASE_URL.startsWith('PASTE_')&&
SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_');

const sb=clientReady?supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=id=>document.getElementById(id);

function msg(t){$('status').textContent=t}

async function login(){
 if(!sb)return $('loginStatus').textContent='पहले config.js में Supabase URL और publishable key डालें।';
 const {error}=await sb.auth.signInWithPassword({
   email:$('email').value.trim(),
   password:$('password').value
 });
 $('loginStatus').textContent=error?error.message:'Login सफल।';
 if(!error) showAdmin();
}

async function showAdmin(){
 $('loginBox').classList.add('hidden');
 $('adminBox').classList.remove('hidden');
 loadList();
}

async function logout(){
 if(sb)await sb.auth.signOut();
 location.reload();
}

function clearForm(){
 ['title','slug','focusKeyword','seoTitle','metaDescription','summary','content','image','source','canonicalUrl'].forEach(x=>$(x).value='');
 $('category').value='Rohtas';
 $('jobType').value='';
 $('published').checked=true;
 $('mediaFile').value='';
 $('imagePreview').style.display='none';
 $('videoPreview').style.display='none';
 $('imagePreview').src='';
 $('videoPreview').src='';
 $('uploadStatus').textContent='';
}

function previewMedia(){
 const file=$('mediaFile').files[0];
 $('imagePreview').style.display='none';
 $('videoPreview').style.display='none';
 if(!file)return;

 const url=URL.createObjectURL(file);
 if(file.type.startsWith('image/')){
   $('imagePreview').src=url;
   $('imagePreview').style.display='block';
 }else if(file.type.startsWith('video/')){
   $('videoPreview').src=url;
   $('videoPreview').style.display='block';
 }
}

async function uploadMedia(){
 const file=$('mediaFile').files[0];
 if(!file)return $('image').value.trim();

 if(!sb)throw new Error('Supabase connect नहीं है।');

 const ext=(file.name.split('.').pop()||'bin').toLowerCase();
 const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'-');
 const path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safeName;

 $('uploadStatus').textContent='⏳ फोटो/वीडियो upload हो रहा है...';

 const {error}=await sb.storage.from('media').upload(path,file,{
   cacheControl:'3600',
   upsert:false,
   contentType:file.type
 });

 if(error)throw error;

 const {data}=sb.storage.from('media').getPublicUrl(path);
 $('uploadStatus').textContent='✅ Media upload हो गया।';
 return data.publicUrl;
}

function slugify(text){
  return text.toString().trim().toLowerCase()
    .replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');
}

function autoSEO(){
  const title=$('title').value.trim();
  if(!$('slug').value || $('slug').dataset.auto==='true'){
    $('slug').value=slugify(title);
    $('slug').dataset.auto='true';
  }
  if(!$('seoTitle').value || $('seoTitle').dataset.auto==='true'){
    $('seoTitle').value=title;
    $('seoTitle').dataset.auto='true';
  }
}

['slug','seoTitle'].forEach(id=>{
  document.addEventListener('input',e=>{
    if(e.target && e.target.id===id)e.target.dataset.auto='false';
  });
});

async function publish(){
 if(!sb)return msg('Supabase connect नहीं है।');

 const {data:{user}}=await sb.auth.getUser();
 if(!user)return location.reload();

 const title=$('title').value.trim();
 if(!title)return msg('Headline लिखिए।');

 try{
   const mediaUrl=await uploadMedia();

   const row={
     title:title,
     slug:$('slug').value.trim() || slugify(title),
     seo_title:$('seoTitle').value.trim() || title,
     meta_description:$('metaDescription').value.trim() || $('summary').value.trim(),
     focus_keyword:$('focusKeyword').value.trim() || null,
     canonical_url:$('canonicalUrl').value.trim() || null,
     summary:$('summary').value.trim(),
     content:$('content').value.trim(),
     category:$('category').value,
     job_type:$('jobType').value||null,
     image_url:mediaUrl,
     source:$('source').value.trim(),
     is_published:$('published').checked
   };

   const {error}=await sb.from('news').insert(row);

   msg(error?error.message:'✅ खबर publish हो गई।');

   if(!error){
     clearForm();
     loadList();
   }
 }catch(e){
   $('uploadStatus').textContent='❌ Upload failed: '+e.message;
   msg('Media upload नहीं हो पाया। Supabase Storage में "Media" bucket और उसकी permissions जांचें।');
 }
}

async function loadList(){
 if(!sb)return $('list').textContent='Supabase config missing';

 const {data,error}=await sb.from('news').select('*').order('published_at',{ascending:false}).limit(50);

 if(error){
   $('list').textContent=error.message;
   return;
 }

 $('list').innerHTML=(data||[]).map(n=>{
   const media=n.image_url||'';
   const isVideo=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(media);

   return `<div class="item">
     <h3>${esc(n.title)}</h3>
     <div class="meta">${esc(n.category)} • ${new Date(n.published_at).toLocaleString('hi-IN')}</div>
     <p>${esc(n.summary)}</p>
     ${media ? (isVideo
       ? `<video src="${esc(media)}" controls style="max-width:100%;max-height:180px"></video>`
       : `<img src="${esc(media)}" style="max-width:100%;max-height:180px;border-radius:8px">`) : ''}
     <br><br>
     <button class="btn danger" onclick="del(${n.id})">Delete</button>
   </div>`;
 }).join('')||'अभी कोई खबर नहीं।';
}

function esc(v){
 return String(v||'').replace(/[&<>"']/g,m=>({
   '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[m]));
}

async function del(id){
 if(!confirm('यह खबर delete करें?'))return;
 const {error}=await sb.from('news').delete().eq('id',id);
 msg(error?error.message:'Deleted');
 loadList();
}

(async()=>{
 if(sb){
   const {data:{session}}=await sb.auth.getSession();
   if(session)showAdmin();
 }
})();
</script>
</body>
</html>
