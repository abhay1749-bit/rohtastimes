<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RohtasTimes Admin</title>
<style>
body{margin:0;background:#f4f6f8;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#172033}
.wrap{max-width:900px;margin:auto;padding:18px}
.head{background:#d71920;color:#fff;padding:18px;border-radius:12px;margin-bottom:15px}.head h1{margin:0}.box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:15px}
input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8dee6;border-radius:8px;margin:6px 0 12px;font-size:14px}
textarea{min-height:120px}.btn{border:0;border-radius:8px;padding:11px 16px;background:#d71920;color:#fff;font-weight:800;cursor:pointer}.gray{background:#475569}.danger{background:#b91c1c}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #ddd;border-radius:10px;padding:13px;margin-top:10px}.item h3{margin:0 0 5px}.meta{font-size:11px;color:#777}.hidden{display:none}.status{margin:8px 0;font-size:13px}
@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head><body><main class="wrap">
<div class="head"><h1>RohtasTimes Admin</h1><div>News Publisher</div></div>

<section id="loginBox" class="box">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
<div id="loginStatus" class="status"></div>
</section>

<section id="adminBox" class="hidden">
<div class="box">
<h2>📰 नई खबर प्रकाशित करें</h2>
<div class="row"><div><label>Category</label><select id="category"><option>Rohtas</option><option>Bihar</option><option>India</option><option>World</option><option>Technology</option><option>Jobs</option><option>Admit Card</option><option>Result</option><option>Education</option><option>Business</option><option>Video</option></select></div>
<div><label>Job Category (सिर्फ Jobs के लिए)</label><select id="jobType"><option value="">Not a Job</option><option>Government</option><option>Private</option><option>Railway</option><option>Police</option><option>Teaching</option><option>Banking</option></select></div></div>
<label>Headline</label><input id="title" placeholder="खबर का headline">
<label>Short Description</label><textarea id="summary" placeholder="खबर का छोटा विवरण"></textarea>
<label>पूरी खबर</label><textarea id="content" placeholder="पूरी खबर यहां लिखें"></textarea>
<label>Photo URL</label><input id="image" placeholder="https://...jpg (अभी image URL डालें)">
<label>Source</label><input id="source" placeholder="Source / Reporter">
<label><input id="published" type="checkbox" checked style="width:auto"> Publish करें</label><br><br>
<button class="btn" onclick="publish()">🚀 Publish News</button> <button class="btn gray" onclick="logout()">Logout</button>
<div id="status" class="status"></div>
</div>
<div class="box"><h2>📋 Published News</h2><div id="list">Loading...</div></div>
</section>
</main>
<script>
const clientReady=SUPABASE_URL&&!SUPABASE_URL.startsWith('PASTE_')&&SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_');
const sb=clientReady?supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=id=>document.getElementById(id);
function msg(t){$('status').textContent=t}
async function login(){
 if(!sb)return $('loginStatus').textContent='पहले config.js में Supabase URL और publishable key डालें।';
 const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('loginStatus').textContent=error?error.message:'Login सफल।';
 if(!error) showAdmin();
}
async function showAdmin(){ $('loginBox').classList.add('hidden');$('adminBox').classList.remove('hidden');loadList()}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
function clearForm(){['title','summary','content','image','source'].forEach(x=>$(x).value='');$('category').value='Rohtas';$('jobType').value='';$('published').checked=true}
async function publish(){
 if(!sb)return msg('Supabase connect नहीं है।');
 const {data:{user}}=await sb.auth.getUser(); if(!user)return location.reload();
 const row={title:$('title').value.trim(),summary:$('summary').value.trim(),content:$('content').value.trim(),category:$('category').value,job_type:$('jobType').value||null,image_url:$('image').value.trim(),source:$('source').value.trim(),is_published:$('published').checked};
 if(!row.title)return msg('Headline लिखिए।');
 const {error}=await sb.from('news').insert(row);
 msg(error?error.message:'✅ खबर publish हो गई।'); if(!error){clearForm();loadList()}
}
async function loadList(){
 if(!sb)return $('list').textContent='Supabase config missing';
 const {data,error}=await sb.from('news').select('*').order('published_at',{ascending:false}).limit(50);
 if(error){$('list').textContent=error.message;return}
 $('list').innerHTML=(data||[]).map(n=>`<div class="item"><h3>${esc(n.title)}</h3><div class="meta">${esc(n.category)} • ${new Date(n.published_at).toLocaleString('hi-IN')}</div><p>${esc(n.summary)}</p><button class="btn danger" onclick="del(${n.id})">Delete</button></div>`).join('')||'अभी कोई खबर नहीं।'
}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function del(id){if(!confirm('यह खबर delete करें?'))return;const {error}=await sb.from('news').delete().eq('id',id);msg(error?error.message:'Deleted');loadList()}
(async()=>{if(sb){const {data:{session}}=await sb.auth.getSession();if(session)showAdmin()}})();
</script></body></html>
